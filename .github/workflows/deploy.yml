name: Deploy FreeTooly to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync Files to Hostinger via LFTP
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-force false;
            set ftp:passive-mode true;
            set net:timeout 15;
            set net:max-retries 3;
            open -u '${{ secrets.HOSTINGER_FTP_USER }}','${{ secrets.HOSTINGER_FTP_PASSWORD }}' 145.79.209.95;
            mirror --reverse --only-newer --parallel=5 --verbose ./out/ ./;
          "
