name: Deploy FreeTooly to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Install LFTP
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sync Files to Hostinger via LFTP
        run: |
          lftp -c "
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            open -u '${{ secrets.HOSTINGER_FTP_USER }}','${{ secrets.HOSTINGER_FTP_PASSWORD }}' 145.79.209.95;
            mirror --reverse --only-newer --parallel=2 --verbose ./out/ ./;
          "
